name: Refresh weekly market prices
# Pulls the Pricify open weekly dataset (CC BY 4.0, no API key) into js/data/prices-live.js.
on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build price layer
        run: python3 scripts/sync_pricify.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- js/data/prices-live.js; then echo "No new data"; exit 0; fi
          TAG="pl$(date -u +%Y%m%d)"
          sed -i -E "s/\?v=[0-9a-zA-Z]+/?v=$TAG/g" index.html sw.js
          sed -i -E "s/bcp-v[0-9a-zA-Z]+/bcp-v$TAG/" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data/prices-live.js index.html sw.js
          git commit -m "Weekly market price refresh ($TAG)"
          git push
